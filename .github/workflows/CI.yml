name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 20 * * *'   # nightly full tier (off-minute per convention)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.tier }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # full tier only on PR + nightly schedule (and tag pushes); plain push = fast
    if: ${{ !(github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && matrix.tier == 'full') }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
        tier:
          - fast
          - full
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          SP_TEST_TIER: ${{ matrix.tier }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest' && matrix.tier == 'fast'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
