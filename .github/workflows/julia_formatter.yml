name: JuliaFormatter
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - run: |
          julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2.5.0")'  # pinned: newer releases changed style rules (2026-10 drift)
          julia -e 'using JuliaFormatter; format(".", verbose=true)'
      - run: |
          git diff --exit-code || (echo "::error::Code is not formatted. Run: julia -e 'using JuliaFormatter; format(\".\")'"; exit 1)
